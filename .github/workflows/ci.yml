name: Laravel CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality_and_tests:
    name: Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_sqlite
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy .env
        run: cp .env.example .env

      - name: Set APP_ENV to testing
        run: |
          php -r "file_put_contents('.env', preg_replace('/APP_ENV=.*/', 'APP_ENV=testing', file_get_contents('.env')));"

      - name: Configure .env for sqlite (CI)
        run: |
          php -r "file_put_contents('.env', preg_replace('/DB_CONNECTION=.*/', 'DB_CONNECTION=sqlite', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/DB_DATABASE=.*/', 'DB_DATABASE=/tmp/database.sqlite', file_get_contents('.env')));"
          touch /tmp/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      # Opcional: Laravel Pint como quality gate
      - name: Run Laravel Pint (formatter)
        run: vendor/bin/pint --test
        # Si aún no usás Pint, podés comentar este bloque.

      - name: Run tests with coverage
        run: php artisan test --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build_artifact:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: quality_and_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure .env for sqlite (CI)
        run: |
          php -r "file_put_contents('.env', preg_replace('/DB_CONNECTION=.*/', 'DB_CONNECTION=sqlite', file_get_contents('.env')));"
          php -r "file_put_contents('.env', preg_replace('/DB_DATABASE=.*/', 'DB_DATABASE=/tmp/database.sqlite', file_get_contents('.env')));"
          touch /tmp/database.sqlite

      - name: Install PHP dependencies (no dev)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare release artifact
        run: |
          tar --exclude='./vendor' \
              --exclude='./node_modules' \
              -czf app-release.tar.gz .

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app-release
          path: app-release.tar.gz
